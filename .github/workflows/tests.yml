name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the scoring-engine tests need real deps (pandas); installing the
      # full requirements.txt (streamlit, psycopg2, etc.) isn't needed to run
      # the current suite and would slow CI down for no benefit yet.
      - run: pip install pytest pandas
      - run: python -m pytest tests/ -v
